function openBackups(){
  const baks=backups();
  if(!baks.length){toast('No backups yet — they build up as you use the app');return;}
  const rows=baks.map(b=>{
    let d={}; try{d=JSON.parse(b.data);}catch(e){}
    const nT=(d.txns||[]).length, nC=(d.cards||[]).length;
    const bud=d.budget&&((+d.budget.total>0)||Object.keys(d.budget.categories||{}).length>0)?'budget set':'no budget';
    return '<div class="bak-row"><div class="bak-m"><b>'+new Date(b.ts).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})+'</b>'+
      '<small>'+nC+' cards · '+nT+' txns · '+bud+'</small></div>'+
      '<button class="btn sm" data-bts="'+b.ts+'">Restore</button></div>';
  }).join('');
  showModal('<h3>Restore from Backup</h3><p style="font-size:13px;color:var(--slate);margin:-6px 0 12px">Pick a snapshot to roll back to. Your current state is backed up first, so this is reversible.</p>'+
    '<div class="bak-list">'+rows+'</div>'+
    '<div class="modal-actions"><span></span><button class="btn" onclick="closeModal()">Close</button></div>');

function clearAll(){
  const total=db.cards.length+db.txns.length+db.payments.length;
  if(total===0){toast('Nothing to clear');return;}
  confirmModal('Clear ALL data? This removes '+db.cards.length+' card(s) and '+db.txns.length+' transaction(s). This cannot be undone.',()=>{
    const ts=now();
    const tomb={cards:{},txns:{},payments:{}};
    ['cards','txns','payments'].forEach(k=>{
      Object.assign(tomb[k],db.tombstones[k]||{});
      (db[k]||[]).forEach(x=>tomb[k][x.id]=ts);
    });
    const cur=cfg.currency;
    db=blankDB();
    db.tombstones=tomb;
    db.settings.currency=cur;

function download(name,text,type){
  const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');
  a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);
}
function exportJSON(){download('cardledger-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json');toast('Backup exported');}
function exportCSV(){
  const r=periodRange();const rows=[['Date','Merchant','Category','Card','Amount','Tags','Note']];
  db.txns.filter(t=>inPeriod(t.date,r)).sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(t=>{
    const c=db.cards.find(x=>x.id===t.cardId);
    rows.push([t.date,t.merchant||'',t.category,(c?c.name+' ••'+c.last4:''),t.amount,t.tags||'',t.note||'']);
  });
  const csv=rows.map(r=>r.map(v=>'"'+(''+v).replace(/"/g,'""')+'"').join(',')).join('\n');
  download('cardledger-'+periodRange().label.replace(/\s/g,'-')+'.csv',csv,'text/csv');toast('CSV exported');
}
function importJSON(e){
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const obj=normalize(JSON.parse(rd.result));db=mergeDB(obj);closeModal();persist();toast('Backup imported & merged');}catch(err){toast('Invalid backup file');}};
  rd.readAsText(f);
}
function importCSVfile(e){
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{parseCSVmap(rd.result);};rd.readAsText(f);
}
function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else{if(ch==='"')q=true;else if(ch===','){row.push(cur);cur='';}
      else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur='';}
      else cur+=ch;}}
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function parseCSVmap(text){
  const rows=parseCSV(text);if(rows.length<2)return toast('CSV looks empty');
  const head=rows[0];const opts=head.map((h,i)=>'<option value="'+i+'">'+esc(h||('Column '+(i+1)))+'</option>').join('');
  const guess=(names)=>{const i=head.findIndex(h=>names.some(n=>(h||'').toLowerCase().includes(n)));return i<0?0:i;};
  const cardOpts=activeCards().map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');
  const catOpts=(db.settings.categories||[]).map(c=>'<option>'+esc(c)+'</option>').join('');
  showModal('<h3>Import Statement · Map Columns</h3><p class="hint" style="margin-top:-8px">'+(rows.length-1)+' rows found. Match each column, then preview.</p>'+
    '<div class="field"><label>Date column</label><select id="m_date">'+opts+'</select></div>'+
    '<div class="field"><label>Amount column</label><select id="m_amt">'+opts+'</select></div>'+
    '<div class="field"><label>Description column</label><select id="m_desc">'+opts+'</select></div>'+
    '<div class="row2"><div class="field"><label>Assign to card</label><select id="m_card">'+cardOpts+'</select></div>'+
    '<div class="field"><label>Default category</label><select id="m_cat">'+catOpts+'</select></div></div>'+
    '<div class="modal-actions"><span></span><div style="display:flex;gap:8px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="m_go">Preview &rarr;</button></div></div>');
  const cm=cfg.csvMap||{};
  document.getElementById('m_date').value=(cm.date!=null&&cm.date<head.length)?cm.date:guess(['date','txn date','transaction','value date']);
  document.getElementById('m_amt').value=(cm.amt!=null&&cm.amt<head.length)?cm.amt:guess(['amount','debit','withdrawal','value','amt']);
  document.getElementById('m_desc').value=(cm.desc!=null&&cm.desc<head.length)?cm.desc:guess(['desc','narration','details','particular','merchant','remarks']);
  document.getElementById('m_go').onclick=()=>{
    const di=+document.getElementById('m_date').value,ai=+document.getElementById('m_amt').value,xi=+document.getElementById('m_desc').value;
    const cardId=document.getElementById('m_card').value,defCat=document.getElementById('m_cat').value;
    cfg.csvMap={date:di,amt:ai,desc:xi};saveCfg();
    csvPreview(rows.slice(1),{di,ai,xi,cardId,defCat});
  };
}
function csvPreview(dataRows,map){
  const items=[];
  dataRows.forEach(r=>{
    const raw=(r[map.ai]||'').replace(/[^0-9.\-]/g,'');const amt=Math.abs(parseFloat(raw));
    if(!amt)return;
    const date=parseDateSmart(r[map.di])||new Date().toISOString().slice(0,10);
    const merch=(r[map.xi]||'').trim().slice(0,80);
    const sug=suggestCategory(merch);
    const cat=(sug&&(db.settings.categories||[]).includes(sug))?sug:map.defCat;
    const dup=db.txns.some(t=>t.cardId===map.cardId&&t.date===date&&Math.abs(t.amount-amt)<0.5&&(t.merchant||'').toLowerCase()===merch.toLowerCase());
    items.push({date,amt,merch,cat,dup});
  });
  if(!items.length)return toast('No valid rows found to import');
  const dupCount=items.filter(i=>i.dup).length;
  const body=items.map((it,i)=>'<tr'+(it.dup?' class="dup"':'')+'>'+
    '<td><input type="checkbox" class="csv-inc" data-i="'+i+'"'+(it.dup?'':' checked')+'></td>'+
    '<td>'+esc(it.date.slice(5))+'</td>'+
    '<td>'+esc(it.merch||'—')+(it.dup?' <span class="dupflag">dup</span>':'')+'</td>'+
    '<td>'+esc(it.cat)+'</td>'+
    '<td class="amt">'+fmt(it.amt)+'</td></tr>').join('');
  showModal('<h3>Preview Import</h3><p class="hint" style="margin-top:-8px">'+items.length+' rows · '+dupCount+' likely duplicate'+(dupCount!==1?'s':'')+' unchecked. Review, then import.</p>'+
    '<div class="csv-preview"><table class="csv-table"><thead><tr><th></th><th>Date</th><th>Merchant</th><th>Category</th><th style="text-align:right">Amount</th></tr></thead><tbody>'+body+'</tbody></table></div>'+
    '<div class="modal-actions"><button class="btn ghost sm" id="csv_all">Toggle All</button><div style="display:flex;gap:8px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="csv_import">Import Selected</button></div></div>');
  document.getElementById('csv_all').onclick=()=>{const boxes=[].slice.call(document.querySelectorAll('.csv-inc'));const anyOff=boxes.some(b=>!b.checked);boxes.forEach(b=>b.checked=anyOff);};
  document.getElementById('csv_import').onclick=()=>{
    let added=0;
    document.querySelectorAll('.csv-inc').forEach(b=>{if(b.checked){const it=items[+b.dataset.i];db.txns.push({id:uid(),date:it.date,amount:it.amt,merchant:it.merch,cardId:map.cardId,category:it.cat,tags:'',note:'imported',updatedAt:now()});added++;}});
    closeModal();persist();toast('Imported '+added+' transaction'+(added!==1?'s':''));
  };
}

/* fintech motion: animate tile numbers counting up on screen entry */
const __reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function fxCountUp(el){
  const txt=(el.textContent||'').trim();
  const m=txt.match(/^([^\d-]*)(-?[\d,]+(?:\.\d+)?)(.*)$/);
  if(!m) return;                                   // no number (e.g. "— Not set") → leave as-is
  const pre=m[1], suf=m[3], target=parseFloat(m[2].replace(/,/g,''));
  if(!isFinite(target)) return;
  const dec=(m[2].split('.')[1]||'').length;
  const grp=n=>{const s=Math.abs(n).toFixed(dec).split('.');s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return (n<0?'-':'')+s.join('.');};
  const dur=700, t0=performance.now();
  function step(now){
    let p=Math.min(1,(now-t0)/dur); p=1-Math.pow(1-p,3);   // easeOutCubic
    el.textContent=pre+grp(target*p)+suf;
    if(p<1) requestAnimationFrame(step); else el.textContent=txt;
  }
  requestAnimationFrame(step);
}
function fxEnter(){
  if(__reduceMotion) return;
  document.querySelectorAll('#app .tiles .v.mono').forEach(fxCountUp);
}
loadCfg();loadLocal();
if(db.settings&&db.settings.currency)cfg.currency=db.settings.currency;
render();
fxEnter();
